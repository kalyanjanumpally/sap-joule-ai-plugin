name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax-check all plugin source files
        working-directory: cds-plugin-llm
        run: |
          for f in lib/*.js lib/providers/*.js lib/cli/*.js lib/cli/commands/*.js lib/middleware/*.js lib/mcp/*.js; do
            node --check "$f"
          done
          for f in test/*.js; do node --check "$f"; done
          for f in ../scripts/*.js; do node --check "$f"; done

      - name: Install @sap/cds (needed by subprocess tests that spawn the CLI)
        working-directory: cds-plugin-llm
        # In-process tests shim @sap/cds via Module._resolveFilename, but the
        # `saptarishi-llm mcp` subprocess test spawns a real child that loads
        # providers (which extend cds.Service) — so the real package must be
        # resolvable in the sandbox for that test to run.
        run: npm install --no-save --no-audit --no-fund --loglevel=error @sap/cds

      - name: Unit tests
        working-directory: cds-plugin-llm
        # explicit file glob rather than `test/` — Node 22 changed directory
        # resolution and treats a bare directory name as a require() target.
        # Capture TAP output; on failure, surface each `not ok` + accompanying
        # file:line as GH annotations so the actual failing test is visible
        # in the check UI without downloading the raw log.
        run: |
          set +e
          node --test test/*.js 2>&1 | tee /tmp/tap.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::group::Failing tests"
            awk '
              /^not ok/ { name=$0; getline; next }
              /^  location:/ && name { gsub(/^  location: /, ""); print "::error file=cds-plugin-llm/" $0 "::" name; name="" }
            ' /tmp/tap.log || true
            grep -E "^not ok" /tmp/tap.log || true
            echo "::endgroup::"
          fi
          exit $rc

      - name: TypeScript type-check (lib/index.d.ts + test/types.test-d.ts)
        working-directory: cds-plugin-llm
        run: |
          npm install --no-save --no-audit --no-fund --loglevel=error typescript @types/node
          npx tsc --noEmit

      - name: End-to-end verification against mock AI Core
        run: node scripts/verify-genai-hub.js

      - name: Syntax-check cds-plugin-vector-hana source files
        working-directory: cds-plugin-vector-hana
        run: |
          for f in lib/*.js lib/backends/*.js test/*.js; do node --check "$f"; done

      - name: Unit tests — cds-plugin-vector-hana (SQLite integration + HANA mock)
        working-directory: cds-plugin-vector-hana
        run: |
          npm install --no-save --no-audit --no-fund --loglevel=error better-sqlite3
          node --test test/*.js

      - name: TypeScript type-check — cds-plugin-vector-hana
        working-directory: cds-plugin-vector-hana
        run: |
          npm install --no-save --no-audit --no-fund --loglevel=error typescript @types/node
          npx tsc --noEmit lib/index.d.ts
